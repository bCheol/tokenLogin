server:
  port: 28080
  servlet:
    context-path: /
    session:
      cookie:
        http-only: 'true'

spring:
  application:
    name: tokenLogin_backend
  profiles:
    default: local

  datasource:
    hikari:
      minimum-idle: 10
      maximum-pool-size: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true